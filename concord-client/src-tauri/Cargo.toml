[package]
name = "concord-client"
version = "0.1.0"
description = "Concord Desktop Client"
authors = ["Concord Team"]
edition = "2021"

[lib]
name = "concord_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
