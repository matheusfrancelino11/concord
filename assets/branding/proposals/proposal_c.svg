<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Proposta C: Mascote Geométrico - Fundo Verde Vivo -->
  <rect width="512" height="512" rx="128" fill="#35A968"/>
  
  <!-- Silhueta Branca do Mascote (Construção ultra-geométrica: fusão entre balão de áudio e face robótica minimalista) -->
  <path fill="#FFFFFF" d="
    M 176 130
    L 336 130
    A 76 76 0 0 1 412 206
    L 412 300
    A 76 76 0 0 1 336 376
    L 280 376
    L 230 420
    L 230 376
    L 176 376
    A 76 76 0 0 1 100 300
    L 100 206
    A 76 76 0 0 1 176 130
    Z
  "/>

  <!-- Elementos Faciais (Recortes geométricos na cor do fundo #35A968) -->
  <!-- Olho Esquerdo: Círculo perfeito com raio generoso para visibilidade em 16x16 -->
  <circle cx="204" cy="242" r="32" fill="#35A968"/>
  
  <!-- Olho Direito: Círculo perfeito no mesmo alinhamento -->
  <circle cx="316" cy="242" r="32" fill="#35A968"/>
  
  <!-- Sobrancelha Angular Direita: Linha geométrica inclinada com forte atitude -->
  <polygon points="288,188 348,168 354,184 294,204" fill="#35A968"/>

  <!-- Sorriso Geométrico Assimétrico: Construção em arco e corte diagonal -->
  <path d="
    M 194 300
    Q 240 338 322 284
  " fill="none" stroke="#35A968" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Acento diagonal do canto do sorriso (chanfro maroto) -->
  <path d="M 320 282 L 334 268" fill="none" stroke="#35A968" stroke-width="18" stroke-linecap="round"/>
</svg>
